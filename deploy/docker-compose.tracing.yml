# Standalone Jaeger for distributed tracing of the L-XOR backend.
#
# The backend runs on the host (via pm2), not inside this compose, so Jaeger
# exposes its ports on the host and the app reaches it at localhost:4318.
# Kept separate from the Supabase stack so it can be started/stopped on its own.
#
# Ports are bound to 127.0.0.1 only: the UI must NOT be reachable directly on the
# server's public IP (that would bypass nginx + Cloudflare). Public access goes
# through nginx (www.iq-home.kz) with Basic Auth — see docs/tracing.md.
#
# Start:  docker compose -f deploy/docker-compose.tracing.yml up -d
# UI:     http://127.0.0.1:16686 locally / https://www.iq-home.kz via nginx
# Stop:   docker compose -f deploy/docker-compose.tracing.yml down

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: lxor-jaeger
    ports:
      - "127.0.0.1:16686:16686" # web UI (waterfall) — localhost only
      - "127.0.0.1:4318:4318"   # OTLP/HTTP ingest (OTEL_EXPORTER_OTLP_ENDPOINT)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
